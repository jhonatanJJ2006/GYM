# Copiar a .github/workflows/android.yml (el token actual no tiene permiso de workflow).
name: Android
on:
  push:
    branches: [main, feat/android-app]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar, pruebas unitarias y de UI (Robolectric) y lint
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain
      - name: APK arm64 minificado
        run: ./gradlew assembleDebug -Phierro.abi=arm64-v8a -Phierro.minify=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gym-hierro-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: |
            android/app/build/reports
            android/app/build/test-results
