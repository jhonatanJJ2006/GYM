# Copiar a .github/workflows/android.yml (el token del bot no puede escribir workflows).
name: Android
on:
  push:
    branches: [main]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - run: ./gradlew assembleDebug -Phierro.abi=arm64-v8a -Phierro.minify=true --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: gym-hierro-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes
          path: |
            android/app/build/reports
            android/app/build/outputs/roborazzi
